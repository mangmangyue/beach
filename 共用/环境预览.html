<!-- 底部那行操作说明已按 Iris 要求删掉（2026-08-31）。
     理由是它把「一进来先读一段说明」当成了交互的一部分，而这个站的规矩是
     「点了就有反应，不给文字提示」。视觉参数面板照旧：右下角那颗 ✦ 或按 E。 -->
<script type="module">
/* 环境验收页 —— 阶段 1.5 的交付物之一。
 * 把两个真模型（唱机、酒瓶插花，只读引用）放进白沙海底，
 * 加一台占位笔电（屏幕 = 唯一光源）和一只灵魂体小熊（透光材质 · 灵魂档）。
 * 物件自己的 viewer 不动，材质分配按 规格 第四节的表。 */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createStage } from './stage.js';
import { grade, gradeImageData, ENV, SCREEN_BGS } from './constitution.js';
import { registerEnvI } from './光照.js';
import { loadShells } from './scene/shells.js';
import { loadFlowers } from './scene/flowers.js';
import { loadCocktail } from './scene/cocktail.js';
import { loadCritters } from './scene/critters.js';
import { loadDevices } from './scene/devices.js';
import { loadGuitar } from './scene/guitar.js';
import { refreshRim, blobShadow } from './scene/util.js';
import { vinylTint, drawVinylBody } from './scene/彩胶.js';
import { TOUCHBAR, LIT_MIN, LIT_MAX, setSoundMuted } from './scene/键盘.js';
import { openPlayer } from '../音乐层/player.js';
import { ui, h } from './ui.js';
import { openGallery } from './相册.js';
import { ALBUMS } from '../音乐层/albums.js';

/* albums.js 里的 cover 写的是相对 音乐层/ 的路径（'covers/xx.jpg'）。
 * 这一页在 /共用/ 下，浏览器按**页面地址**解析，直接用就是 404。
 * 补前缀这件事有三个地方要做（黑胶标签、迷你窗缩略图、唱片架网格），
 * 所以抽成一个函数 —— 之前是各写各的，抄漏了两处。
 * 已经是绝对地址 / 已经补过前缀的（http、/ 开头、.. 开头）原样放行。 */
const coverURL = c => {
  if (!c) return '';
  /* ⚠️ 这个函数会被**套着调用两次**：albums 那份进来时补一次前缀，
   * 之后 audio.state.cover 把补过的那份传回来，迷你窗口又调一次。
   * 所以它必须是**幂等**的 —— 而 encodeURI 不是：它会把 `%` 再编成 `%25`，
   * 第二次调用直接把好路径编坏（中文目录名全是 %XX，一编就 404）。
   * 已经是绝对地址 / 已经补过前缀的原样返回，一个字符都不动。 */
  if (/^(https?:|\/|\.\.)/.test(c)) return c;
  return encodeURI('../音乐层/' + c);
};

import { audio } from './audio.js';
import { WAVE_SOUND } from './浪声参数.js';

const canvas = document.getElementById('view');
const stage = createStage(canvas, {
  target: new THREE.Vector3(0, 0.10, -0.05),
  distance: 1.9,
  azimuth: 0.16,            // 默认正对电脑屏幕和浪打来的方向，只偏一点点 3/4
  shells: false,            // 用 物件_贝壳/ 的真贝壳库，不要 stage 自带的程序化贝壳
});
stage.enableSandDrag();   // 现在只有贝壳可推（主物件都坐在野餐垫上，不注册陷沙）
/* 兔子光标**暂时下线**（Iris 08-30：「太花里胡哨，继续搞意义不大」）。
 * 代码和素材都留着：共用/光标.js（程序画版）+ 共用/光标/*.png（手绘切片版）。
 * 想恢复：initBunnyCursor(canvas) + stage.setCursorHook(k => bunny.setGrab(k))，
 * 并把下面 hover 那两处 canvas.style.cursor 换回 bunny.setHover / setHoverAux。 */

/* ================= 野餐垫 ——「桌子概念」=================
 * 主物件（电脑、唱机、酒瓶、封套、小熊）坐在垫子上，不陷沙、不可拖；
 * 垫子本身把沙压出一圈浅浅的边，布面顺着沙丘微微起伏。 */
// lift = 布面架在（抹平过的）沙上方多少；floor = 布面离沙**至少**要留多少。
// floor 是条硬规矩：沙 < 垫子 < 垫上的东西。压痕再深也只能压到贴着沙为止。
const BLANKET = { x: 0.02, z: -0.04, w: 1.9, h: 1.4, lift: 0.006, floor: 0.002 };
{
  const S = stage.envScale;
  // 垫子把沙压下去一点（两个浅坑盖住长方形），要在采样 sandY 之前登记
  stage.sand.addDent((BLANKET.x - 0.45) / S, BLANKET.z / S, 4.2, 0.03);
  stage.sand.addDent((BLANKET.x + 0.48) / S, BLANKET.z / S, 4.2, 0.03);
}
const inBlanket = (x, z, pad = 0.06) => Math.abs(x - BLANKET.x) < BLANKET.w / 2 + pad && Math.abs(z - BLANKET.z) < BLANKET.h / 2 + pad;
/* 褶皱：照 真实照片/褶皱感.HEIC —— 不是细碎的褶，是几道**长而柔的缎面脊**，
 * 像几条河一样蜿蜒，宽、软、过渡平滑。所以是平滑着色 + 低频的长脊，再叠极轻的细纹。 */
const RIDGES = [
  { a: -0.28, amp: 0.12, f: 3.6, p: 0.4, w: 0.11, hh: 0.030, along: 'z' },
  { a:  0.40, amp: 0.14, f: 2.7, p: 2.1, w: 0.09, hh: 0.024, along: 'z' },
  { a:  0.18, amp: 0.10, f: 4.2, p: 1.0, w: 0.08, hh: 0.020, along: 'x' },
  { a: -0.45, amp: 0.08, f: 5.0, p: 3.0, w: 0.07, hh: 0.014, along: 'x' },
];
function blanketFold(lx, lz) {
  let h = 0;
  for (const R of RIDGES) {
    const s = R.along === 'z' ? lz : lx, t = R.along === 'z' ? lx : lz;
    const center = R.a + Math.sin(s * R.f + R.p) * R.amp + Math.sin(s * R.f * 2.3 + R.p * 1.7) * R.amp * 0.3;
    const d = (t - center) / R.w;
    const env = 0.55 + 0.45 * Math.sin(s * 2.1 + R.p);          // 脊沿长度有强有弱、会消失再出现
    h += R.hh * Math.exp(-d * d) * Math.max(0, env);
  }
  h += (Math.sin(lx * 11 + lz * 7) + Math.sin(lx * 19 - lz * 13)) * 0.0007;   // 极轻的细纹
  // 边角微翘。ex/ez 必须夹到 1：pow(·, 8) 在垫子外面会指数爆炸
  // （吉他的包围盒角点探到垫外 20cm 时这一项就有 6cm，把吉他顶到半空 —— 踩过的坑）
  const ex = Math.min(1, Math.abs(lx) / (BLANKET.w / 2)), ez = Math.min(1, Math.abs(lz) / (BLANKET.h / 2));
  h += Math.pow(Math.max(ex, ez), 8) * 0.012 * (0.4 + 0.6 * Math.abs(Math.sin(lx * 5.3 + lz * 3.1)));
  return h;
}
/* 布边的不规则：几层值噪声叠起来，幅度 ≈ 1cm，没有固定周期 */
const hash1 = x => { const s = Math.sin(x * 127.1) * 43758.5453; return s - Math.floor(s); };
const vnoise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash1(i) * (1 - u) + hash1(i + 1) * u; };
const edgeNoise = s => (vnoise1(s * 2.1) - 0.5) * 0.018 + (vnoise1(s * 6.3 + 11) - 0.5) * 0.008 + (vnoise1(s * 17 + 5) - 0.5) * 0.003;
/* 压布场（"垫子的重力"）：每个垫上物件按脚印把布压下去几毫米，并把身下的褶皱压平。
 * pressers 由排版系统维护（物件动了就更新 + 重建布面网格）。 */
const pressers = [];   // { x, z, hx, hz, rot, depth }：脚印是物件自己的朝向矩形，不是世界包围盒
/* 世界坐标 → 某个脚印的局部坐标（把绕 y 轴的 rot 转回去） */
function toPress(p, x, z) {
  const dx = x - p.x, dz = z - p.z;
  const c = Math.cos(p.rot), s = Math.sin(p.rot);
  return [dx * c - dz * s, dx * s + dz * c];
}
function pressAt(x, z) {
  let dip = 0, flat = 0, cover = 0;
  for (const p of pressers) {
    const k = coverAt(p, x, z);      // 1 = 正压在物件轮廓底下，往外三格化开到 0
    if (k <= 0) continue;
    dip += p.dip * k;
    flat = Math.max(flat, p.flat * k);
    cover = Math.max(cover, k);
  }
  return [Math.min(dip, 0.012), flat, cover];   // 叠加封顶；真正的下限由 blanketTop 的 floor 兜
}
/* 布面高度（世界坐标）。垫子上的所有东西都按它落位 */
/* 布贴不住沙：布面跟的是「抹平过的沙」（周围 5 点平均），沙的小起伏被布架空 ——
 * 褶皱就是布和沙之间那点对不上产生的 */
const sandSmooth = (x, z) => (stage.sandY(x, z) * 2 + stage.sandY(x + 0.12, z) + stage.sandY(x - 0.12, z) + stage.sandY(x, z + 0.12) + stage.sandY(x, z - 0.12)) / 6;
const blanketTop = (x, z) => {
  const [dip, flat] = pressAt(x, z);
  const sand = stage.sandY(x, z);
  const h = Math.max(sandSmooth(x, z), sand - 0.004) + BLANKET.lift
          + blanketFold(x - BLANKET.x, z - BLANKET.z) * (1 - flat)   // 压得住的地方褶皱才消失
          - dip;                                                     // 压痕
  // 布永远在沙上面。压痕（吉他 7mm、唱机 6mm）比 lift 还深，沙面又有起伏，
  // 不封这一刀的话重物底下的布会沉到沙面以下 —— 画面上就是沙从垫子里冒出来。
  // 压到贴着沙就压不动了，剩下的力气该由沙自己承担（真实世界也是这样）。
  return Math.max(h, sand + BLANKET.floor);
};
function ginghamTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const line = ENV.blanketLine.replace('#', '');
  const [lr, lg, lb] = [0, 2, 4].map(i => parseInt(line.substr(i, 2), 16));
  x.fillStyle = ENV.blanketBase; x.fillRect(0, 0, 128, 128);
  x.fillStyle = `rgba(${lr},${lg},${lb},${ENV.blanketLineA / 100})`;   // 格纹：两个方向各画一遍，交叉处自然更深
  for (let i = 0; i < 4; i++) x.fillRect(i * 32 + 18, 0, 14, 128);
  for (let i = 0; i < 4; i++) x.fillRect(0, i * 32 + 18, 128, 14);
  // 不过调色变换：变换会把白压灰，垫子就"脏"了、和别的东西不在一个图层（Iris 08-22）
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6.5, 4.8);
  t.anisotropy = 4;
  return t;
}
let clothMat = null;
stage.onParams(() => {            // 面板里改了垫子的颜色/格纹/提亮 → 重画贴图
  if (!clothMat) return;
  clothMat.map?.dispose(); clothMat.map = ginghamTexture(); clothMat.emissiveIntensity = ENV.blanketGlow / 100; clothMat.needsUpdate = true;
});
let rebuildBlanket = () => {};
/* 布面顶点的快照：xz（世界坐标，含布边抖动）+ 高度。
 * 物件落位直接查这张表 —— 查的就是画面里那张布本身，
 * 而不是另外解析采样一遍。三角面是线性的，顶点都在物件下面 ⇒ 整个面都在下面，
 * 「布从吉他中间穿出来」这件事从此在构造上不可能发生。 */
const CLOTH = { nx: 72, nz: 52, x: null, z: null, y: null };
{
  const geo = new THREE.PlaneGeometry(BLANKET.w, BLANKET.h, 72, 52);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const baseXZ = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) { baseXZ[i * 2] = pos.getX(i); baseXZ[i * 2 + 1] = pos.getZ(i); }
  const col = new Float32Array(pos.count * 3).fill(1);
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  CLOTH.x = new Float32Array(pos.count);
  CLOTH.z = new Float32Array(pos.count);
  CLOTH.y = new Float32Array(pos.count);
  rebuildBlanket = () => {
    for (let i = 0; i < pos.count; i++) {
      let lx = baseXZ[i * 2], lz = baseXZ[i * 2 + 1];
      pos.setY(i, blanketTop(lx + BLANKET.x, lz + BLANKET.z));
      const ex = Math.abs(lx) / (BLANKET.w / 2), ez = Math.abs(lz) / (BLANKET.h / 2);
      if (ex > 0.999 || ez > 0.999) {              // 布边：不规则的小进出（不是规整的波浪）
        const s = ex > 0.999 ? lz : lx;
        const j = edgeNoise(s + (ex > 0.999 ? 3.1 : 7.7) * Math.sign(ex > 0.999 ? lx : lz));
        if (ex > 0.999) pos.setX(i, lx + Math.sign(lx) * j);
        if (ez > 0.999) pos.setZ(i, lz + Math.sign(lz) * j);
      }
      CLOTH.x[i] = pos.getX(i) + BLANKET.x;
      CLOTH.z[i] = pos.getZ(i) + BLANKET.z;
      CLOTH.y[i] = pos.getY(i);
    }
    bakeShade();
    pos.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;
    geo.computeVertexNormals();
  };

  /* 褶皱的明暗 —— 烘进顶点色。
   *
   * 为什么不能只靠 three 的实时光照：这个场景里超过一半的光是**环境光**
   * （半球光 0.5 + 环境贴图 0.4，对主光 0.7）。环境光没有遮蔽，照哪儿都一样亮 ——
   * 布面的法线明明有 45° 的起伏，画出来却是平的。原来那份烘焙只有 ±5%，等于没有。
   *
   * 两项：
   *   遮蔽（主项）—— 比周围低的地方看不见天空，环境光进不去，所以谷底暗
   *   受光（次项）—— N·L，和沙的着色器、stage 的主光同一个方向
   * 两项都乘 ENV.blanketShade，面板「野餐垫 · 褶皱明暗」直接拖。 */
  const W = 72, H = 52, NX = W + 1;
  const at = (i, j) => Math.min(H, Math.max(0, j)) * NX + Math.min(W, Math.max(0, i));
  function bakeShade() {
    const k = (ENV.blanketShade ?? 100) / 100;
    const d = stage.sunDir();                 // 全场同一个太阳（面板「光 · 太阳方位角/高度角」）
    const L = [d.x, d.y, d.z];
    const R = 3;                       // 遮蔽的采样半径（格）≈ 8cm ≈ 一道脊的宽度
    for (let j = 0; j <= H; j++) for (let i = 0; i <= W; i++) {
      const n = at(i, j), y = CLOTH.y[n];
      // 遮蔽：邻域平均高度比自己高多少 —— 越低越在谷里
      let sum = 0, cnt = 0;
      for (let dj = -R; dj <= R; dj += R) for (let di = -R; di <= R; di += R) {
        sum += CLOTH.y[at(i + di, j + dj)]; cnt++;
      }
      const ao = Math.min(1, Math.max(0, (sum / cnt - y) / 0.011));
      // 受光：有限差分求坡度 → N·L（平地时 = L.y）
      const dx = CLOTH.x[at(i + 1, j)] - CLOTH.x[at(i - 1, j)] || 1e-4;
      const dz = CLOTH.z[at(i, j + 1)] - CLOTH.z[at(i, j - 1)] || 1e-4;
      const gx = (CLOTH.y[at(i + 1, j)] - CLOTH.y[at(i - 1, j)]) / dx;
      const gz = (CLOTH.y[at(i, j + 1)] - CLOTH.y[at(i, j - 1)]) / dz;
      const inv = 1 / Math.hypot(gx, 1, gz);
      const ndl = (-gx * L[0] + L[1] - gz * L[2]) * inv;
      const v = 1 - ao * 0.40 * k + (ndl - L[1]) * 0.55 * k;
      col[n * 3] = col[n * 3 + 1] = col[n * 3 + 2] = Math.min(1.15, Math.max(0.45, v));
    }
  }
  rebuildBlanket();
  clothMat = new THREE.MeshStandardMaterial({
    map: ginghamTexture(), roughness: 0.55, metalness: 0, flatShading: false, vertexColors: true,
    emissive: new THREE.Color('#FFFFFF'), emissiveIntensity: ENV.blanketGlow / 100,   // 一点自发光把布从沙里"提"出来
  });
  // 自发光默认是**平加**上去的，会把烘好的褶皱明暗冲淡（提亮 23 就冲掉快三成）。
  // 让它也乘上顶点色：布还是被"提"出来了，但谷底依然是谷底。
  clothMat.onBeforeCompile = sh => {
    sh.fragmentShader = sh.fragmentShader.replace(
      '#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n\ttotalEmissiveRadiance *= vColor;');
  };
  clothMat.customProgramCacheKey = () => 'blanketCloth';
  const blanket = new THREE.Mesh(geo, clothMat);
  blanket.position.set(BLANKET.x, 0, BLANKET.z);
  blanket.userData.noSink = true;
  stage.world.add(blanket);
  /* 「厚度侧裙」已删（Iris 08-29）：原来沿布边建一圈 4mm 侧面，但它是按**建垫子那一刻**
   * 的顶点快照建的，压布场之后持续改布面高度，侧裙跟不上，就脱开成一条悬空的线。
   * 与其每帧同步一圈顶点，不如不要 —— 布本来也就一两毫米厚。 */
}
/* 物件的脚印 —— 用真实轮廓，不用包围盒。
 *
 * 为什么不能用包围盒：吉他是葫芦形、还转了 -38°，世界包围盒会胖成一个 1.0×1.0 的方块。
 * 拿方块当脚印有两个后果，都见过：琴腰两侧本来没被压住的褶皱被一起压平了；
 * 而方块角上（那里根本没有琴）恰好压着一道褶皱脊，落位取「脚印内最高点」时
 * 就被这道脊顶起来 —— 吉他浮在半空 5cm，或者反过来，脊从琴身中间穿出来。
 *
 * 做法：把物件所有三角面往 xz 平面拍扁，栅格化成一张小位图（物件自己的朝向下算），
 * 再往外扩散出一圈 0→1 的软边当压布的过渡。24k 个三角形，每次重排版几毫秒。 */
const boxOf = (obj, b = new THREE.Box3(), tmp = new THREE.Box3()) => {
  b.makeEmpty();
  obj.traverse(o => {
    if (!o.isMesh || o.userData.noBounds || !o.geometry) return;

    /* 盘体 **raw 特批**（同贝壳/贴纸）：彩胶色是手选的合成色，不是照片。
     * 过 grade 的话饱和被封顶在 ~75，彩胶直接灰掉（08-29 实测）。
     * 标签（封面照片）和纸底照旧过 grade，和别的贴图物件在一个世界里。 */
    drawVinylBody(x, REC_N, { tint: tint.hex, alpha: ENV.vinylA / 100,
      groove: ENV.vinylGroove / 100, labelR: REC_LABEL_R });
    // 标签底：全实的纸白 —— 半透明盘体直接贴封面的话，封面会跟着透
    x.beginPath(); x.arc(REC_N / 2, REC_N / 2, REC_LABEL_R + 0.5, 0, Math.PI * 2);
    x.fillStyle = grade('#F2EEE6'); x.fill();
    if (recCoverImg) {                      // 封面圆裁进标签（半径多给 0.5px 盖住抗锯齿边），先过 grade
      const R = REC_LABEL_R + 0.5;
      const oc = document.createElement('canvas');
      oc.width = oc.height = Math.ceil(R * 2);
      const ox = oc.getContext('2d', { willReadFrequently: true });
      ox.drawImage(recCoverImg, 0, 0, oc.width, oc.height);
      ox.putImageData(gradeImageData(ox.getImageData(0, 0, oc.width, oc.height)), 0, 0);
      x.save();
      x.beginPath(); x.arc(REC_N / 2, REC_N / 2, R, 0, Math.PI * 2); x.clip();
      x.drawImage(oc, REC_N / 2 - R, REC_N / 2 - R, R * 2, R * 2);
      x.restore();
    }
    x.beginPath(); x.arc(REC_N / 2, REC_N / 2, REC_HOLE_R, 0, Math.PI * 2);
    x.fillStyle = grade('#0C0C0F'); x.fill();   // 中心孔
    recTex.dispose();                       // canvas 内容换了要重新分配 GPU 纹理，光 needsUpdate 不够
    recTex.needsUpdate = true;
  }
  const vinylSigNow = () => [ENV.vinylA, ENV.vinylGroove, ENV.vinylC, ENV.vinylNujabesC,
    coverHex, coverAlbumId, recCoverImg?.src].join('|');
  fetch(TT + 'tex/manifest.json').then(r => r.json()).then(m => {
    const rec = m.records.find(r => r.name === 'kei nishikori meet nujabes') || m.records[0];
    loadTex(TT + rec.sleeve, setMap(mats.M_SleeveArt));
    if (rec.back) loadTex(TT + rec.back, setMap(mats.M_SleeveBack));
    if (rec.spine) loadTex(TT + rec.spine, setMap(mats.M_SleeveSpine));
  });
  let recCoverSrc = null;
  audio.on('change', st => {
    if (!st.cover || st.cover === recCoverSrc) return;   // 停了不清空：封面保持刚刚放的那张
    recCoverSrc = st.cover;
    const im = new Image();
    im.onload = () => {
      recCoverImg = im;
      // ⚠️ st.albumId 是 Spotify 的专辑 id（'1FVw3…'），不是 albums.js 的 id —— 按 cover 对（原样传递，最稳）
      const alb = ALBUMS.find(a => a.cover === st.cover || a.spotifyAlbum === st.albumId);
      coverAlbumId = alb?.id || null;
      coverHex = alb?.vinyl || alb?.accent || st.accent || null;
      redrawRecord();
    };
    im.onerror = () => console.warn('封面没加载到:', st.cover);
    im.src = coverURL(st.cover);
  });
  /* 还没放过歌时也得是一张完整的唱片（Iris 08-29：「默认状态也得有封面」）——
   * 预载 Sons of 1973：封面上标签、彩胶用它的蓝。真放这张时 recCoverSrc 相同，不会重加载。 */
  {
    const alb = ALBUMS.find(a => a.id === 'sons-of-1973') || ALBUMS[0];
    recCoverSrc = alb.cover;
    coverAlbumId = alb.id;
    coverHex = alb.vinyl || alb.accent;
    const im = new Image();
    im.onload = () => { recCoverImg = im; redrawRecord(); };
    im.src = encodeURI('../音乐层/' + alb.cover);
  }
  new GLTFLoader().load(TT + 'turntable.glb', gltf => {
    const parts = {};
    gltf.scene.traverse(o => {
      if (o.name && !parts[o.name]) parts[o.name] = o;
      if (o.isMesh) o.material = mats[o.material?.name] || solid('#888888');
    });
    Object.keys(parts).filter(k => k.startsWith('Sticker_')).forEach(k => { parts[k].visible = false; });
    if (parts.Sleeve) parts.Sleeve.visible = false;    // 封套拿掉，只留唱机（Iris，2026-08-22）
    if (parts.DustCover) parts.DustCover.visible = false; // 防尘罩也不要了（Iris，2026-08-22）
    // 黑胶厚度跟面板走（模型原厚度 = 100%；Iris 08-22 定 33）
    tickers.push(() => { if (parts.Record) parts.Record.scale.y = ENV.recordThick / 100; });
    /* 彩胶：贴图参数（滑块/试色板/换专辑）变了才重画。
     * ⚠️ 透明件排序：机身 0 < 底座 1 < 彩胶 2，从下往上 —— 三层都是透明的，
     * 靠深度排序在掠射角上会翻车（"唱臂被彩胶吃掉"那类）。浪是 2，和彩胶不重叠。 */
    if (parts.Platter) parts.Platter.renderOrder = 1;
    if (parts.Record) parts.Record.renderOrder = 2;
    tickers.push(() => {
      vinylUniforms.uRimS.value = ENV.vinylRim / 100;
      if (vinylSigNow() !== vinylSig) redrawRecord();
    });
    ['Plinth', 'DustCover'].forEach(n => parts[n] && stage.markGlass(parts[n]));
    stage.world.add(gltf.scene);
    registerLayout('tt', gltf.scene);
    turntableObj = gltf.scene;
    registerHover(gltf.scene);
    turntableParts = parts;
    // 唱片转不转由音乐层的 audio.state.playing 驱动（唱机不持有音频状态）
    let spin = 0;
    tickers.push(dt => {
      const target = audio.state.playing ? 1 : 0;
      spin += (target - spin) * Math.min(1, dt * 1.4);
      if (parts.Record) parts.Record.rotation.y -= dt * 3.49 * spin;   // 33⅓ rpm
      if (parts.Tonearm) parts.Tonearm.rotation.y = -0.537 * spin;     // 落针
    });
    done();
  });
}

/* 愿望的存取：优先走 /wishes 接口（共用/许愿服务.py，同一个地址的人互相看得到），
 * 接口不在就退回浏览器本地。别人新许的愿靠轮询，4 秒一次。 */
const wishStore = {
  remote: null, seen: new Set(),
  async init() {
    try { const r = await fetch('/wishes', { cache: 'no-store' }); this.remote = r.ok; if (r.ok) return (await r.json()).wishes || []; }
    catch { this.remote = false; }
    try { return JSON.parse(localStorage.getItem('wishes') || '[]'); } catch { return []; }
  },
  async add(w) {
    if (this.remote) { await fetch('/wishes', { method: 'POST', body: JSON.stringify(w) }).catch(() => {}); return; }
    localStorage.setItem('wishes', JSON.stringify([...(JSON.parse(localStorage.getItem('wishes') || '[]')), w].slice(-40)));
  },
  async remove(id) {
    if (this.remote) { await fetch('/wishes?id=' + encodeURIComponent(id), { method: 'DELETE' }).catch(() => {}); return; }
    localStorage.setItem('wishes', JSON.stringify(JSON.parse(localStorage.getItem('wishes') || '[]').filter(w => w.id !== id)));
  },
  async poll() {
    if (!this.remote) return [];
    const j = await fetch('/wishes', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
    return j ? j.wishes : [];
  },
};
function fly(text, kind, w = null) {
  const wish = w || { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text, kind, t: Date.now() };
  wishStore.seen.add(wish.id);
  const obj = stage.spawnBubble({ text: wish.text, kind: wish.kind, at: [cat.position.x, cat.position.z] });
  obj.userData.wish = wish;
  attachText(obj, wish.text);
  if (!w) wishStore.add(wish);
}
wishStore.init().then(list => {
  list.forEach((w, i) => setTimeout(() => fly(null, null, w), 1500 + i * 700));
  if (wishStore.remote) setInterval(async () => {
    for (const w of await wishStore.poll()) if (!wishStore.seen.has(w.id)) fly(null, null, w);   // 别人刚许的愿也飘过来
  }, 4000);
});

/* ================= 浪声 =================
 * 引擎在 共用/audio.js 第 4.5 节（照 海浪声实验室.html v2 抄的六层合成），
 * 音色参数在 共用/浪声参数.js（Iris 在实验室里调的，纯数据）。
 *
 * **和动画同步**：实验室里是"每 gap 秒响一发"的定时器；这里删掉了定时器，
 * 改成**浪冲上来的那一下触发一发**。
 * 触发时机往前提一个 atk：声音的包络峰值要落在**水线冲得最快**那一帧
 * （实测在相位 0.20），而不是落在触发那一帧。

{
  let lastPh = 1, armed = true;
  tickers.push(dt => {
    const wv = stage.waves;
    if (!wv || !wv.state.on || !audio.wavesOn) return;
    audio.waveTick();                       // 风铃自己的随机调度（按设计不跟着浪）
    const ph = wv.phase();
    if (ph < lastPh) armed = true;          // 新的一轮潮
    lastPh = ph;
    // 画面上浪最猛在相位 0.20；把触发提前一个 atk，让声音的峰值和它对上
    const peak = 0.20 * wv.state.period;
    const trig = Math.max(0, peak - WAVE_SOUND.master.atk) / wv.state.period;
    if (armed && ph >= trig) {
      armed = false;
      audio.waveBreak({ strength: 0.85 + Math.random() * 0.3 });
    }
  });
  // 浏览器不许没交互就出声：第一次点画布时打开（以后加载页的 ENTER 接管）
  const kick = () => { audio.waves(true); removeEventListener('pointerdown', kick); };
  addEventListener('pointerdown', kick);
  // 面板「浪 · 湿沙 → 浪声音量 / 浪声 1合成 0真实」
  let lastMode = null;
  const applyVol = () => {
    audio.setAmbienceVolume(ENV.waveVol / 100);

  };
  applyVol(); stage.onParams(applyVol);
  window.__waveAudio = { peek: () => ({ env: +audio.waveEnvelope().toFixed(3), level: +audio.waveLevel().toFixed(4) }) };
}

 * 鼠标移到能点的东西上：**物件轻轻抬起来一点** + 接触阴影收紧 + 光标变手型。

 *
 * 为什么是"抬起来"而不是高亮描边 / 放大：
 * 这个场景本来就在说物理的话 —— 东西陷在沙里、把垫子压出坑。
 * 「抬起来一点」是同一套语言的延伸，不用往画面里加新的视觉词汇；
 * 描边发光是游戏 UI 的词，放在这张野餐垫上很出戏（宪法：平滑柔和的极简）。 */
{
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let dirty = false;
  canvas.addEventListener('pointermove', e => { hoverXY = [e.clientX, e.clientY]; dirty = true; });
  canvas.addEventListener('pointerleave', () => { hoverNow = null; canvas.style.cursor = ''; });

  tickers.push(dt => {

    if (dirty) {
      dirty = false;
      const r = canvas.getBoundingClientRect();
      ndc.set(((hoverXY[0] - r.left) / r.width) * 2 - 1, -((hoverXY[1] - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, stage.camera);
      const objs = HOVER.map(h => h.obj);
      const hit = ray.intersectObjects(objs, true)[0];
      let found = null;
      if (hit) {
        let n = hit.object;
        while (n && !objs.includes(n)) n = n.parent;
        found = HOVER.find(h => h.obj === n) || null;
      }
      // 海也算"到可触发范围"（看海入口没有文字提示，光标变手型就是信号）
      const seaHover = !found && !deskOn && !seaOn && !!seaPointAt(ray);

        seaHoverNow = seaHover;

    }
    for (const h of HOVER) {
      h.target = (h === hoverNow && !deskOn) ? HOVER_LIFT : 0;

      if (h.lift === 0) h.base = h.obj.position.y;
      h.lift += (h.target - h.lift) * (1 - Math.exp(-dt * 14));
      if (h.target === 0 && Math.abs(h.lift) < 2e-5) h.lift = 0;
      h.obj.position.y = h.base + h.lift;
      // 影子跟着收：离地了就该小一点
      const en = layoutReg.find(l => l.obj === h.obj);
      if (en && en.shadow) {
        const k = h.lift / HOVER_LIFT;
        if (en.shadow.userData.baseScale === undefined) en.shadow.userData.baseScale = en.shadow.scale.x;
        const b = en.shadow.userData.baseScale;
        en.shadow.scale.set(b * (1 - k * 0.16), b * (1 - k * 0.16), 1);

/* ================= 气泡（点向日葵）=================
 * 像发 iMessage：**不管戳哪一朵，气泡都从同一个位置冒出来**，
 * 上一条被往上顶。新的永远在最下面。
 *
 * 做法：一个竖直的 flex 容器，**底边**钉在锚点上（translate(-50%,-100%)），
 * 往里 append 就自然出现在最下面、旧的往上走 —— 不用自己算每条的位置。
 * 锚点是**一个 3D 点**（向日葵那丛的上方），每帧投影一次，所以转镜头时整摞跟着走。
 *
 * 材质用设计系统的 `.y2k-glass`（和窗口是同一块玻璃）。
 * ⚠️ ui.css 说 backdrop-filter 很贵、只给窗口那一层用 —— 这里同时最多 5 条，可以接受。
 * 台词随便加，MURMURS 里加一行就行。 */
const MURMURS = [
  '你找到带有向日葵气息的武士了吗？',
  '向日葵是没有气味的',
  '流泪道别并不适合我们，因为下次见面时会很难为情',
  '雨一直不停就好了',

/* 吉他现在**能点但点了没反应** —— 音频/视频还没录。
 * 三种做法里选了这一种（Iris 2026-09-01 定的）：
 *   ① 把点击摘掉  → 但它已经登记了悬停（会抬起来、光标变兔子），说「能点」又不给反应，
 *                    那是三种里最像坏掉的一种
 *   ② 弹一个窗口  → 一个系统对话框跳出来说「还没做」，是从这个世界外面说话
 *   ③ **一句气泡** → 和向日葵同一套语言：物件自己小声说一句。选它。
 * 录完之后：把下面 GUITAR_LINES 和点击里那一支删掉，换成真正的交互。 */
const GUITAR_LINES = ['作者大大艰难产出中…'];

const BUBBLE_MAX = 5, BUBBLE_LIFE = 9.5;
let bubbleBox = null, bubbleAnchor = null, bubbleFor = null, lastMurmur = -1;
const bubbleList = [];

/* @param anchorObj  气泡从哪个物件头顶冒出来
 * @param lines      候选台词（默认向日葵那几句） */
function murmurAt(anchorObj, lines = MURMURS) {
  if (!bubbleBox) {
    bubbleBox = h('div.y2k', {
      style: { position: 'fixed', zIndex: '9996', pointerEvents: 'none',
               display: 'flex', flexDirection: 'column', gap: '7px',
               alignItems: 'flex-start', transform: 'translate(-50%,-100%)' },
    });
    document.body.appendChild(bubbleBox);
  }
  /* 锚点跟着**是谁在说话**走。同一个物件只算一次（戳哪一朵向日葵都从同一处冒），
   * 换了物件就重算，并且把上一个物件的话**当场收走** ——
   * 吉他说的话飘在向日葵头顶，那就成了另一个物件在说话了。 */
  if (bubbleFor !== anchorObj) {
    bubbleFor = anchorObj;
    const b = new THREE.Box3().setFromObject(anchorObj);
    bubbleAnchor = b.getCenter(new THREE.Vector3());
    bubbleAnchor.y = b.max.y + 0.055;
    for (const old of bubbleList.splice(0)) old.el.remove();
    lastMurmur = -1;
  }
  // 随机一句，但不要连着重复上一句
  let i = Math.floor(Math.random() * lines.length);
  if (lines.length > 1 && i === lastMurmur) i = (i + 1) % lines.length;
  lastMurmur = i;

  /* 只有一句话的时候（吉他就是），连点会叠出五条一模一样的 ——
   * 那不像「它又说了一遍」，像界面卡了。同一句就只把它的寿命续上。 */
  const same = bubbleList[bubbleList.length - 1];
  if (same && same.el.textContent === lines[i]) { same.t = 0; return; }

  const el = h('div.y2k-glass', {
    style: { padding: '8px 15px', borderRadius: '16px 16px 16px 5px', whiteSpace: 'nowrap',
             font: '12px/1.5 var(--y2k-font, -apple-system,"PingFang SC",sans-serif)',
             letterSpacing: '.05em', color: 'var(--y2k-ink, #1E3A57)',
             // ⚠️ `.y2k-glass` 出厂的 --y2k-shade 是全透明的（窗口那么大一块、又有背景模糊，
             //    透明也读得清）。气泡只有一行字、又浮在亮沙滩上，不给底就是一片看不清的字。
             //    --y2k-shade / --y2k-tint 本来就是留着让人按场景改的变量，改这两个而不是
             //    另写一套背景，材质还是设计系统那块玻璃。
             '--y2k-shade': 'rgba(252,253,255,.62)',
             '--y2k-tint': 'rgba(255,255,255,.30)',
             opacity: '0', transform: 'translateY(8px)',
             transition: 'opacity .28s var(--y2k-ease,ease), transform .28s var(--y2k-ease,ease)' },
  }, lines[i]);
  bubbleBox.appendChild(el);
  requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });
  bubbleList.push({ el, t: 0 });
  while (bubbleList.length > BUBBLE_MAX) {          // 超了就把最老那条推走
    const old = bubbleList.shift();
    old.el.style.opacity = '0';
    setTimeout(() => old.el.remove(), 300);
  }
}
tickers.push(dt => {
  if (!bubbleBox || !bubbleAnchor) return;
  for (let i = bubbleList.length - 1; i >= 0; i--) {
    const b = bubbleList[i];
    b.t += dt;
    if (b.t > BUBBLE_LIFE) {
      b.el.style.opacity = '0';
      setTimeout(() => b.el.remove(), 300);
      bubbleList.splice(i, 1);
    }
  }
  if (!bubbleList.length) { bubbleBox.style.opacity = '0'; return; }
  bubbleBox.style.opacity = '1';
  const r = canvas.getBoundingClientRect();
  const p = bubbleAnchor.clone().project(stage.camera);
  bubbleBox.style.left = (r.left + (p.x * 0.5 + 0.5) * r.width) + 'px';
  bubbleBox.style.top = (r.top + (-p.y * 0.5 + 0.5) * r.height) + 'px';
});

/* ================= 一杯调好的酒 → A Cocktail =================
 * 内嵌一个 iframe，不跳走 —— 点回来还是这张野餐垫。
 * 查过了：a-cocktail.com 没有 X-Frame-Options 也没有 CSP frame-ancestors，能嵌。
 * 但那是**别人服务器上的配置**，哪天加上了这儿不能白屏，所以：
 *   占位层一直在底下（"正在打开…" + 外链按钮），iframe 盖在上面、load 了才淡入。
 *   ⚠️ 不要"超时就把 iframe 换掉" —— 第一版给了 3.5 秒就换，

  if (barWin && !barWin.closed) { barWin.focus(); return; }

  const openOut = () => open(url, '_blank', 'noopener');
  const hint = h('div', { style: { opacity: '.72', fontSize: '13px', letterSpacing: '.06em' } }, '正在打开 a-cocktail.com …');
  const placeholder = h('div', {
    style: { position: 'absolute', inset: '0', display: 'flex', flexDirection: 'column',
             alignItems: 'center', justifyContent: 'center', gap: '12px' },
  }, hint, ui.btn({ label: '在新标签页打开', variant: 'ghost', onClick: openOut }));
  const frame = h('iframe', {
    src: url, title: 'A Cocktail',

  });

     * 那颗「在新标签页打开」的幽灵按钮就会从人家排版中间透出来
     * （Iris 2026-08-31 看到的中间那个框）。 */
    placeholder.style.display = 'none';

    onClose: () => { if (barFrame) { barFrame.src = 'about:blank'; barFrame.style.opacity = '0'; } },

/* ⚠️ 尺寸要同时钉在 root 和 window 上（交接 5.2 那条坑）：

function sizeBar() {

/* ================= Touch Bar 上那两个真能用的控件 =================
 * 左边 ☀ + 轨道 = 屏幕亮度（ENV.screenLit），右边 🔊 = 声音总开关（audio.mute）。
 * 键盘面是我们自己画的（共用/scene/键盘.js），所以按钮在贴图里的位置是已知的（TOUCHBAR），
 * 拿射线打到键盘面的 `hit.uv` 和它比一下就知道点到哪个了。
 * ⚠️ 贴图是 flipY = false，所以 uv.v 直接就是「画布 y / H」，不用翻。 */
function hitTouchBar(ray) {
  if (!deckMesh) return false;
  const hit = ray.intersectObject(deckMesh, false)[0];
  if (!hit || !hit.uv) return false;
  const { x: u, y: v } = hit.uv;
  const inBox = b => b && u >= b.x0 && u <= b.x1 && v >= b.y0 && v <= b.y1;
  if (inBox(TOUCHBAR.track) || inBox(TOUCHBAR.sun)) {
    // 点轨道上哪儿就设成哪个亮度；点太阳本身 = 回到 100
    const b = TOUCHBAR.track;
    ENV.screenLit = inBox(TOUCHBAR.sun)
      ? 100
      : Math.round(LIT_MIN + (LIT_MAX - LIT_MIN) * (u - b.x0) / (b.x1 - b.x0));
    stage.applyParams();
    redrawDeck();
    return true;
  }
  if (inBox(TOUCHBAR.sound)) {
    audio.mute(!audio.muted);
    setSoundMuted(audio.muted);      // 键盘面上那个喇叭要跟着换样子
    redrawDeck();
    return true;
  }
  return false;
}
function redrawDeck() { deckTex?.userData?.redraw?.(); }

/* ================= 凑近看电脑屏幕 =================
 * 不是弹窗：镜头真的飞到屏幕前面，海、浪、泡泡、光照全都还在跑（Iris 要的就是这个）。
 * 屏幕面片叫 mba_screen（物件_设备 的 glb 里），对着它的世界法线站住 ——

let deskOn = false, deskHint = null;
function screenMesh() {
  let m = null;

  return m;
}
function enterDesk() {
  const m = screenMesh();
  if (!m) return;
  stage.focusOnFace(m, { fill: 0.62, lift: 0.10, dur: 0.9 });
  deskOn = true;
  showHint(true);
}
function leaveDesk() {
  if (!deskOn && !stage.isFocused()) return;
  stage.unfocus({ dur: 0.8 });
  deskOn = false;
  showHint(false);
}
const toggleDesk = () => (deskOn ? leaveDesk() : enterDesk());
/* 凑近之后点屏幕 = 换下一张壁纸。走 ENV + applyParams，
 * 所以面板上的「屏幕风格」滑块会跟着跳，两边永远是一个值。 */
function nextWallpaper() {
  ENV.screenBg = (Math.round(ENV.screenBg) + 1) % SCREEN_BGS.length;
  stage.applyParams();
}
/* 临时的提示条。**视觉归 UI 窗口**，这里只保证功能可用（见 PROJECT.md 的 UI 窗口待办）。 */
function showHint(on) {
  if (!deskHint) {
    deskHint = document.createElement('div');
    deskHint.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);' +
      'z-index:9997;padding:6px 14px;border-radius:14px;pointer-events:none;opacity:0;' +
      'background:rgba(18,21,28,.55);color:#dbe6f2;backdrop-filter:blur(6px);' +
      'font:11px/1.6 -apple-system,"PingFang SC",sans-serif;letter-spacing:.08em;' +
      'transition:opacity .35s';
    deskHint.textContent = '按 Esc 或点空白处退回';
    document.body.appendChild(deskHint);
  }
  deskHint.style.opacity = on ? '1' : '0';
}
addEventListener('keydown', e => { if (e.key === 'Escape') { leaveDesk(); leaveSea(); } });

/* ================= 看海 =================
 * 点海（水那边的空地）→ 镜头飞到水线上空，看浪来回、贝壳被推着走；
 * 再点海 / Esc / 点空白 退回。和「点电脑凑近」是同一套语法。
 *
 * 为什么不是气泡提示：交互不给文字提示（Iris 的规矩），
 * "能点"的信号交给光标 —— 兔子挪到海上会变成「到可触发范围」的表情。
 * 为什么不开平移：Iris 08-29 定稿「中心不变」，看海是一个**定点机位**，
 * 到了那边照样可以转（flyTo 会临时放开限位，退回时 unfocus 恢复）。 */
let seaOn = false, seaHoverNow = false;
const SEA_HIT_Z = -2.6;             // 地面交点 z 比这更远（更负）就算"点到海"
function seaPointAt(ray) {
  const t = -ray.ray.origin.y / ray.ray.direction.y;
  if (t <= 0) return null;
  const z = ray.ray.origin.z + ray.ray.direction.z * t;
  return z < SEA_HIT_Z ? { x: ray.ray.origin.x + ray.ray.direction.x * t, z } : null;
}
function enterSea() {
  // 机位 = 调贝壳分布时那个俯视位（Iris 08-30：「看海的本意是看贝壳」）——
  // 从垫子前沿上空往下看整条贝壳带和来回的水线
  stage.flyTo(new THREE.Vector3(0, 2.6, 0.6), new THREE.Vector3(0, 0, -2.4), { dur: 1.1 });
  seaOn = true;
  showHint(true);
}
function leaveSea() {
  if (!seaOn) return;
  stage.unfocus({ dur: 0.9 });
  seaOn = false;
  showHint(false);
}
const toggleSea = () => (seaOn ? leaveSea() : enterSea());

/* ================= 相册（相机）================= */
function openPhotos() {
  openGallery({ width: ENV.galW + 'px', height: ENV.galH + 'px' });
}
stage.onParams(() => {
  const w = [...document.querySelectorAll('.y2k-window')]
    .find(x => (x.querySelector('.y2k-titlebar__title') || {}).textContent === '照片');
  if (!w) return;
  w.style.setProperty('--y2k-w', ENV.galW + 'px');
  w.style.setProperty('--y2k-h', ENV.galH + 'px');
});

/* ================= 迷你播放器 =================
 * 一个不带遮罩的小窗口，钉在右下角：现在放的是什么 + 上一首 / 暂停 / 下一首。
 * 用的是同一套 ui.window，所以和唱片架、许愿窗是同一块玻璃。
 * 上/下一首走 audio.next()/prev() —— 那是音乐层注册的 backend，
 * 所以唱片架至少要被打开过一次；没打开过时按钮是灰的。 */
let miniWin = null, miniEls = null;
function buildMini() {
  // 单行 + 省略号：文字换行会让窗口高度变，而它是靠右下角定位的 —— 一变就是"跳"
  const clip = { whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', display: 'block' };
  const thumb = h('img.y2k-row__thumb', { alt: '', style: { width: '34px', height: '34px', borderRadius: '5px', objectFit: 'cover', flex: '0 0 auto' } });
  const title = h('span.y2k-row__title', { style: clip }, '—');
  const sub   = h('span.y2k-row__sub', { style: clip }, '');
  const prevB = ui.btn({ label: '⏮', size: 'sm', variant: 'ghost', title: '上一首', onClick: () => audio.prev() });
  const playB = ui.btn({ label: '▶', size: 'sm', variant: 'primary', title: '播放 / 暂停', onClick: () => audio.toggle() });
  const nextB = ui.btn({ label: '⏭', size: 'sm', variant: 'ghost', title: '下一首', onClick: () => audio.next() });
  /* ⚠️ 原来这里还有一颗「架」按钮（打开唱片架）。2026-08-31 Iris 删掉了 ——
   * 场景里点那张黑胶就回唱片架了，小窗口上再放一颗是把同一件事说两遍，
   * 而这个窗口只有 118px 高，每多一颗按钮中间就更挤一分。 */

  miniWin = ui.window({
    /* compact：薄标题栏（40→26px）+ 薄页脚，省下来的高度还给中间那一行。
     * 这个窗口只有一百多像素高，上下那两条白原来占掉了将近一半（Iris 08-31）。 */
    title: '正在放', sub: '', compact: true, width: ENV.miniW + 'px',
    height: ENV.miniH > 0 ? ENV.miniH + 'px' : 'auto',
    fixedHeight: ENV.miniH > 0,
    modal: false,               // 不要遮罩：它是常驻的，不该挡住场景
    keepAlive: true,            // 关掉只是收起，下次换歌再冒出来
    closeOnEsc: false, closeOnScrim: false,
  });
  // 非模态窗口的 root 是普通 div，位置得自己钉。右下角，让开「✦ 视觉参数」那颗按钮
  // 非模态窗口的 root 是普通 div，位置和宽度都得自己钉。
  // root 不给宽度的话它会缩到内容宽，而 .y2k-window 是 min(--y2k-w, 100%) —— 100% 就成了那个缩过的宽，
  // 滑块拉大也不动。右下角，让开「✦ 视觉参数」那颗按钮。
  Object.assign(miniWin.el.style, { position: 'fixed', right: '14px', bottom: '56px', zIndex: '880' });
  sizeMini();
  /* ⚠️ 留白**不要写成内联样式**。三段间距（线上 / 线下 / 键距）在
   * 「✦ 视觉参数」里有滑块，走的是 ui.css 的 --y2k-mini-* 令牌；
   * 这里写死内联的话内联优先级更高，拖滑块不会有任何反应。
   * 三颗键居中：原来是「左边三颗 + spacer + 右边那颗『架』」，
   * 「架」删掉之后 spacer 就没有意义了，留着只会把三颗键钉在左边。 */
  miniWin.setView(
    h('div.y2k-section.y2k-section--tight.y2k-mini',
      h('div.y2k-row.y2k-row--static.y2k-mini__info',
        thumb, h('span.y2k-row__main', { style: { minWidth: '0' } }, title, sub)),
      h('div.y2k-mini__keys', prevB, playB, nextB),
    ),
  );
  miniEls = { thumb, title, sub, playB, prevB, nextB };
  return miniWin;
}
/* 宽高都得钉在 root 上：.y2k-window 是 min(--y2k-w, 100%)，
 * 而非模态窗口的 root 不给尺寸就会缩到内容大小 —— 100% 成了那个缩过的值，滑块拉不动。 */
function sizeMini() {
  if (!miniWin || miniWin.closed) return;
  miniWin.el.style.width = ENV.miniW + 'px';
  miniWin.el.style.height = ENV.miniH > 0 ? ENV.miniH + 'px' : '';
  miniWin.win.style.setProperty('--y2k-w', ENV.miniW + 'px');
  miniWin.win.style.setProperty('--y2k-h', ENV.miniH > 0 ? ENV.miniH + 'px' : 'auto');
  miniWin.win.classList.toggle('y2k-window--fixed', ENV.miniH > 0);
}
{
  let lastTrack = null;
  audio.on('change', st => {
    if (!st.trackId) return;                       // 还没选过歌就不冒出来
    if (!miniWin) buildMini();
    const e = miniEls;
    /* ⚠️ 这里必须走 coverURL()。audio.state 里的 cover 是 albums.js 的**原样**
     * （'covers/xx.jpg'，相对 音乐层/），这页在 /共用/ 下，直接用就是 404 ——
     * 小窗口的缩略图一直是个碎图标（08-31 顺手修的）。比的也要是补过前缀的那个，
     * 否则每次 change 都判为「不一样」，一直重新赋值。 */
    const cv = st.cover ? coverURL(st.cover) : '';
    if (cv && e.thumb.getAttribute('src') !== cv) e.thumb.src = cv;
    e.title.textContent = st.title || '—';
    e.sub.textContent = [st.artist, st.album].filter(Boolean).join(' — ');
    e.playB.textContent = st.playing ? '⏸' : '▶';
    e.playB.title = st.playing ? '暂停' : '播放';
    /* 副标题原来在暂停时写「已暂停」，08-31 删了 ——
     * 暂停与否看播放键的图标就知道（player.js 里那个同名的标签也一起删了）。 */
    miniWin.setTitle('正在放', '');
    // 换歌时只有「被收起来了」才叫它回来。
    // 以前每次换歌都 reopen()，而 reopen 里有 api.focus() —— 焦点一跳，
    // 窗口就跟着闪一下、看着像位置在跳。
    if (st.trackId !== lastTrack) {
      lastTrack = st.trackId;
      if (miniWin.parked) {
        const prev = document.activeElement;
        miniWin.reopen();
        try { prev?.focus?.({ preventScroll: true }); } catch { /* 元素可能已经没了 */ }
      }
    }
  });
}

/* ================= 循环 ================= */
let time = 0, frames = 0;
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  time += dt;
  for (const f of tickers) { try { f(dt, time); } catch (e) { if (!f.__err) { f.__err = true; console.error('ticker 出错，已跳过：', e); } } }
  stage.render(dt);
  frames++;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= 存图（POST /save → 共用/渲染/，服务器不在就退回下载） ================= */
function setCam(azDeg, pitchDeg, dist) {
  const t = stage.controls.target;
  const az = azDeg * Math.PI / 180;
  const po = Math.PI / 2 - pitchDeg * Math.PI / 180;
  const d = dist || stage.camera.position.distanceTo(t);
  stage.camera.position.set(
    t.x + d * Math.sin(po) * Math.sin(az),
    t.y + d * Math.cos(po),
    t.z + d * Math.sin(po) * Math.cos(az));
  stage.controls.update();
}
function captureAs(name) {
  stage.render(1 / 60);
  const data = canvas.toDataURL('image/png');
  return fetch(`/save?name=${encodeURIComponent(name)}.png&dir=${encodeURIComponent('共用')}`,
    { method: 'POST', body: data })
    .then(r => { if (!r.ok) throw 0; return 'saved'; })
    .catch(() => { const a = document.createElement('a'); a.download = name + '.png'; a.href = data; a.click(); return 'downloaded'; });
}
window.setCam = setCam;
window.captureAs = captureAs;
window.__dbg = { stage, THREE };
</script>
