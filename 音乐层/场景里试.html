<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在真场景里试材质</title>
<link rel="stylesheet" href="../共用/ui.css">
<style>
  html, body { height: 100%; margin: 0; background: #05070C; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #view:active { cursor: grabbing; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             font: 11px/1.6 -apple-system,"PingFang SC",sans-serif;
             letter-spacing: .22em; color: #7D8694; }

  /* 调参面板。照 共用/环境预览.html 里「✦ 视觉参数」那个的做法，
   * 拖着看、满意了点「复制参数」，把值贴回 共用/ui.css 的令牌。 */
  #panel {
    position: fixed; right: 12px; top: 12px; z-index: 950; width: 232px;
    max-height: calc(100vh - 24px); overflow: auto;
    padding: 12px 13px 14px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #C6DCEE; background: rgba(8, 18, 32, .82);
    border: 1px solid rgba(159, 192, 220, .30); border-radius: 12px;
    backdrop-filter: blur(8px);
  }
  #panel h3 { margin: 0 0 9px; font-size: 10px; letter-spacing: .2em; color: #8FB4D4; font-weight: 700; }
  #panel .k { display: flex; align-items: center; gap: 7px; margin: 0 0 6px; }
  #panel .k > span:first-child { flex: none; width: 74px; color: #8CA6BE; }
  #panel .k > span:last-child { flex: none; width: 34px; text-align: right; color: #DCEEFA; }
  #panel input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: #7FB8E6; height: 16px; }
  #panel .row { display: flex; gap: 6px; margin-top: 10px; }
  #panel button {
    flex: 1 1 auto; padding: 6px 8px; cursor: pointer;
    font: 10px/1.3 ui-monospace, Menlo, monospace; letter-spacing: .1em;
    color: #DCEEFA; background: rgba(120, 175, 220, .22);
    border: 1px solid rgba(159, 192, 220, .40); border-radius: 7px;
  }
  #panel button:hover { background: rgba(140, 195, 235, .34); }
  #panel .seg { display: flex; gap: 5px; margin-bottom: 11px; }
  #panel .seg button.on { background: rgba(150, 210, 250, .45); color: #061826; }
  #panel .note { margin-top: 9px; color: #7E97AE; font-size: 10px; line-height: 1.6; }
  #tip { position: fixed; left: 14px; bottom: 12px; z-index: 950;
         font: 10.5px/1.6 -apple-system,"PingFang SC",sans-serif; letter-spacing: .05em;
         color: #93A7BB; text-shadow: 0 1px 6px rgba(0,0,0,.7); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../共用/vendor/three/build/three.module.js",
    "three/addons/": "../共用/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">载入中</div>
<div id="tip">拖空处转视角 ｜ 滚轮缩放 ｜ 右上角调材质，满意了点「复制参数」</div>

<div id="panel">
  <h3>材质</h3>
  <div class="seg">
    <button data-mat="glass" class="on">玻璃</button>
    <button data-mat="bubble">泡泡</button>
  </div>
  <div class="seg">
    <button data-ink="light" class="on">浅字</button>
    <button data-ink="dark">深字</button>
  </div>
  <div id="knobs"></div>
  <div class="row">
    <button id="reopen">重开窗口</button>
    <button id="copy">复制参数</button>
  </div>
  <div class="note">
    <b>想更透但字要读得清 → 先加「文字垫底」，别加「白染色」。</b>
    白染色是整块面板发灰的来源；垫底只垫在有字的那块。<br>
    改完点「复制参数」，把值贴回 <b>共用/ui.css</b> 第 1 节（玻璃）或 1.5 节（泡泡）。
  </div>
</div>

<script type="module">
/* 真场景 —— 直接用窗口 A 的 共用/stage.js，只读引用，什么都不改。
 * 这一页存在的唯一理由：材质好不好看，只有压在真的沙滩和浪上才判断得了。 */
import * as THREE from 'three';
import { createStage } from '../共用/stage.js';
import { ui } from '../共用/ui.js';
import { openPlayer } from './player.js';
import { audio } from '../共用/audio.js';

const stage = createStage(document.getElementById('view'), {
  target: new THREE.Vector3(0, 0.10, -0.05),
  distance: 1.9,
  azimuth: 0.16,
});
/* ——— 背后垫一块格纹野餐垫 ———
 * 不是为了好看：**折射只有在背后有结构的时候才看得见**。
 * 光秃秃的沙 + 天是一片平滑渐变，弯了也几乎看不出变化 ——
 * 「折射带 / 折射力 / 色散」三个滑块拖了没反应，就是因为背后没东西可折。
 * 真站上去，窗口后面本来就有垫子的格纹、唱机、笔电。 */
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#F4F6F5'; x.fillRect(0, 0, 128, 128);
  x.fillStyle = 'rgba(150,180,205,0.55)';
  for (let i = 0; i < 4; i++) x.fillRect(i * 32 + 18, 0, 14, 128);
  for (let i = 0; i < 4; i++) x.fillRect(0, i * 32 + 18, 128, 14);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(5, 3.5);
  const geo = new THREE.PlaneGeometry(1.46, 1.04, 40, 30);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, stage.sandY(pos.getX(i) + 0.02, pos.getZ(i) - 0.04) + 0.008);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .92, metalness: 0 });
  const blanket = new THREE.Mesh(geo, mat);
  blanket.position.set(0.02, 0, -0.04);
  stage.world.add(blanket);
}

document.getElementById('loading').remove();

let last = performance.now();
(function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  stage.render(dt);
  requestAnimationFrame(loop);
})(performance.now());

audio.autoUnlock();

/* ---------------------------------------------------------------------------
 * 调参：直接改 :root 上的自定义属性，窗口不用重开就能看到
 * ------------------------------------------------------------------------- */
const KNOBS = [
  { k: 'shade',  label: '熏色',   min: 0, max: 60, step: 1, unit: '%',
    apply: v => setAlpha('--y2k-shade', v / 100) },
  { k: 'tint',   label: '白染色', min: 0, max: 30, step: 1, unit: '%',
    apply: v => setAlpha('--y2k-tint', v / 100) },
  { k: 'blur',   label: '模糊',   min: 0, max: 12, step: .5, unit: 'px',
    apply: v => { BLUR.blur = v; setBlur(); } },
  { k: 'sat',    label: '饱和',   min: 100, max: 260, step: 5, unit: '%',
    apply: v => { BLUR.sat = v / 100; setBlur(); } },
  { k: 'core',   label: '内核光', min: 0, max: 30, step: 1, unit: '%',
    apply: v => setAlpha('--y2k-core', v / 100, '196,232,255') },
  /* ★ 想「透」但字要读得清，先动这个，别去加白染色 —— 白染色是发灰的来源 */
  { k: 'plate',  label: '文字垫底', min: 0, max: 60, step: 1, unit: '%',
    apply: v => setAlpha('--y2k-plate', v / 100, '6,20,40') },
  { k: 'album',  label: '跟碟染色', min: 0, max: 40, step: 1, unit: '%',
    apply: v => root.style.setProperty('--y2k-album-mix', v + '%') },
  { k: 'rimW',   label: '边宽',   min: 0, max: 6, step: .2, unit: 'px',
    apply: v => root.style.setProperty('--y2k-rim-w', v + 'px') },
  { k: 'specA',  label: '光斑浓', min: 0, max: 40, step: 1, unit: '%',
    apply: v => root.style.setProperty('--y2k-spec-a', v / 100) },
  { k: 'specR',  label: '光斑大', min: 40, max: 500, step: 10, unit: 'px',
    apply: v => root.style.setProperty('--y2k-spec-r', v + 'px') },
  { k: 'band',   label: '折射带', min: 10, max: 140, step: 2, unit: 'px', lens: true },
  { k: 'scale',  label: '折射力', min: 0, max: 400, step: 5, unit: '', lens: true },
  { k: 'chroma', label: '色散',   min: 0, max: 40, step: 1, unit: '', lens: true },
];

/* 出厂值，跟 共用/ui.css 第 1 节（玻璃）和 1.5 节（泡泡）保持一致。
 * 改了 ui.css 记得也改这里，不然一开面板就把 CSS 的值盖掉了。 */
const PRESET = {
  glass:  { shade: 0,  tint: 15, blur: 12, sat: 195, core: 20, plate: 3,  album: 0,  rimW: .6,  specA: 40, specR: 40,  band: 140, scale: 400, chroma: 0 },
  bubble: { shade: 13, tint: 3, blur: 0,   sat: 150, core: 17, plate: 20, album: 13, rimW: 3,   specA: 16, specR: 120, band: 86, scale: 140, chroma: 22 },
};

/* ⚠️ 令牌要写在**窗口元素**上，不能写 :root。
 * 材质（.y2k-mat-bubble）是挂在窗口上的类，它比 :root 更靠近，
 * 写在 :root 上的值会被它盖掉 —— 拖滑块看着没反应就是这个原因。
 * 写成窗口的内联样式，两套材质下都最优先。 */
const root = { style: { setProperty: (k, v) => win?.win?.style.setProperty(k, v),
                        get cssText() { return win?.win?.style.cssText || ''; },
                        set cssText(v) { if (win) win.win.style.cssText = v; } } };
const BLUR = { blur: 1.5, sat: 1.95 };
let mat = 'glass';
let win = null;

const setBlur = () =>
  root.style.setProperty('--y2k-blur', `blur(${BLUR.blur}px) saturate(${BLUR.sat}) brightness(1.03)`);

/* 令牌都是 rgba(...)，只换 alpha，别的不动 */
function setAlpha(name, a, forceRgb) {
  if (!win) return;
  const cur = getComputedStyle(win.win).getPropertyValue(name).trim();
  const m = cur.match(/rgba?\(([^)]+)\)/);
  const rgb = forceRgb || (m ? m[1].split(',').slice(0, 3).map(x => x.trim()).join(',') : '255,255,255');
  root.style.setProperty(name, `rgba(${rgb}, ${a})`);
}

const state = { ...PRESET.glass };
const knobsEl = document.getElementById('knobs');

for (const kn of KNOBS) {
  const row = document.createElement('label');
  row.className = 'k';
  row.innerHTML = `<span>${kn.label}</span><input type=range min=${kn.min} max=${kn.max} step=${kn.step}><span></span>`;
  const [, input, out] = row.children;
  input.oninput = () => {
    state[kn.k] = Number(input.value);
    out.textContent = input.value + kn.unit;
    if (kn.lens) applyLens(); else kn.apply(Number(input.value));
  };
  kn._input = input; kn._out = out;
  knobsEl.appendChild(row);
}

function applyLens() {
  win?.setLens?.({ band: state.band, scale: -state.scale, chroma: state.chroma });
}

function pushAll() {
  for (const kn of KNOBS) {
    kn._input.value = state[kn.k];
    kn._out.textContent = state[kn.k] + kn.unit;
    if (!kn.lens) kn.apply(state[kn.k]);
  }
  applyLens();
}

function open() {
  ui.setMaterial(mat);
  win = openPlayer();
  win.setMaterial(mat);                  // 已经开着的话也切过去
  win.win.style.cssText = '';            // 清掉上一套手调的值，让新材质的出厂值先生效
  requestAnimationFrame(pushAll);        // 再把面板上的值盖回去
}

document.querySelectorAll('[data-mat]').forEach(b => {
  b.onclick = () => {
    mat = b.dataset.mat;
    document.querySelectorAll('[data-mat]').forEach(x => x.classList.toggle('on', x === b));
    Object.assign(state, PRESET[mat]);
    BLUR.blur = state.blur; BLUR.sat = state.sat / 100;
    open();                              // 换材质不拆窗口，歌不会断
  };
});
document.querySelectorAll('[data-ink]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('[data-ink]').forEach(x => x.classList.toggle('on', x === b));
    ui.setInk(b.dataset.ink);
    win?.setInk(b.dataset.ink);
  };
});

document.getElementById('reopen').onclick = () => { win?.destroy?.(); win = null; open(); };
document.getElementById('copy').onclick = () => {
  const txt = `/* ${mat} —— ${new Date().toISOString().slice(0, 10)} 在真场景里调的 */\n`
    + `--y2k-shade: rgba(6,18,38,${(state.shade / 100).toFixed(2)});\n`
    + `--y2k-tint:  rgba(255,255,255,${(state.tint / 100).toFixed(2)});\n`
    + `--y2k-blur:  blur(${state.blur}px) saturate(${(state.sat / 100).toFixed(2)}) brightness(1.03);\n`
    + `--y2k-core:  rgba(196,232,255,${(state.core / 100).toFixed(2)});\n`
    + `--y2k-plate: rgba(6,20,40,${(state.plate / 100).toFixed(2)});\n`
    + `--y2k-album-mix: ${state.album}%;\n`
    + `--y2k-rim-w: ${state.rimW}px;\n`
    + `--y2k-spec-a: ${(state.specA / 100).toFixed(2)};  --y2k-spec-r: ${state.specR}px;\n`
    + `refract: { band: ${state.band}, scale: ${-state.scale}, chroma: ${state.chroma} }`;
  navigator.clipboard?.writeText(txt);
  console.log(txt);
  const b = document.getElementById('copy');
  b.textContent = '已复制 ✓';
  setTimeout(() => { b.textContent = '复制参数'; }, 1400);
};

open();
</script>
</body>
</html>
